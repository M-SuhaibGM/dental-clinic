# Render Blueprint: one PostgreSQL database + one web service that serves both the API (/api/*)
# and the built React app. Deploy via Render Dashboard → New → Blueprint → select this repo.
databases:
  - name: dental-clinic-db
    plan: free
    databaseName: dental_clinic
    user: dental_clinic

services:
  - type: web
    name: dental-clinic
    runtime: node
    plan: free
    branch: develop
    buildCommand: npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: TZ
        value: Asia/Karachi
      - key: DATABASE_URL
        fromDatabase:
          name: dental-clinic-db
          property: connectionString
      - key: DATABASE_SSL
        value: "false"   # internal Render URL; set "true" if you use the External Database URL
      - key: SEED_ON_START
        value: "true"
